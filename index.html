<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaid-i-Azam University (QAU) - Academic Showcase Kiosk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qau: {
                            navy: '#0F2B5B',
                            gold: '#F59E0B',
                            azure: '#27ACE2',
                            emerald: '#10B981',
                            dark: '#0F172A'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #FFFFFF;
            overflow: hidden;
            user-select: none;
        }

        .hero-bg-container {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-badge {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .glass-card-dark {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .glass-circle-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        .glass-circle-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* RIGHT CIRCULAR THUMBNAILS CONTAINER (BOGAZICI STYLE) */
        .sidebar-right-nav {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 110px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.35), transparent);
        }

        .circle-thumb-item {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: -3px 0;
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #0F172A;
        }

        .circle-thumb-item:hover {
            transform: scale(1.1) translateX(-5px);
            border-color: #27ACE2;
            z-index: 50;
        }

        .circle-thumb-item.active {
            width: 76px;
            height: 76px;
            border: 4px solid #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 8px 24px rgba(0, 0, 0, 0.6);
            transform: scale(1.08) translateX(-10px);
            z-index: 50;
        }

        .hero-enter {
            animation: heroFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 bg-slate-950 text-white overflow-hidden relative">

    <!-- TOP BAR / HEADER -->
    <header class="w-full px-6 py-3 flex items-center justify-between z-30 relative">
        <div class="flex items-center space-x-4">
            <button class="text-white hover:text-qau-azure text-2xl transition-colors cursor-pointer" title="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full bg-white p-1 flex items-center justify-center shadow-lg border border-white/40 overflow-hidden shrink-0">
                    <img src="logo.jpg" alt="QAU Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://qau.edu.pk/wp-content/uploads/2020/09/qaulogo.png';">
                </div>
                <div class="leading-tight">
                    <h1 class="text-lg md:text-xl font-black tracking-wider text-white uppercase drop-shadow-md">
                        Quaid-i-Azam University
                    </h1>
                    <p class="text-[10px] text-slate-200 font-semibold tracking-widest uppercase drop-shadow">Islamabad, Pakistan</p>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Weather Badge -->
            <div class="hidden sm:flex items-center space-x-3 glass-badge px-4 py-2 rounded-xl shadow-sm">
                <i class="fa-solid fa-cloud-sun text-qau-azure text-xl"></i>
                <div class="text-left">
                    <div class="text-[10px] text-slate-300 uppercase tracking-wider font-semibold">Islamabad, PK</div>
                    <div class="text-xs font-bold text-white">24°C • Mostly Sunny</div>
                </div>
            </div>

            <!-- Digital Clock Badge -->
            <div class="glass-badge px-5 py-2 rounded-xl text-right shadow-sm border-l-2 border-l-qau-azure">
                <div class="text-base font-black tracking-wider text-qau-azure font-mono" id="digital-clock">00:00:00 AM</div>
                <div class="text-[10px] uppercase tracking-widest text-slate-300 font-semibold" id="digital-date">Tuesday, 27 Oct 2026</div>
            </div>

            <!-- FULLSCREEN BUTTON ONLY -->
            <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-xl glass-badge text-white hover:text-qau-azure flex items-center justify-center transition cursor-pointer shadow-sm" title="Toggle Fullscreen">
                <i class="fa-solid fa-expand text-base"></i>
            </button>
        </div>
    </header>

    <!-- MAIN HERO STAGE -->
    <main class="flex-1 relative z-10 overflow-hidden rounded-2xl border border-white/30 shadow-2xl my-2">
        <div id="slide-stage" class="w-full h-full relative hero-bg-container">
            <!-- Content Dynamically Rendered via JS -->
        </div>

        <!-- RIGHT SIDEBAR FLOATING CIRCULAR THUMBNAILS -->
        <div class="sidebar-right-nav" id="sidebar-thumbnails">
            <!-- Populated dynamically by JS -->
        </div>

        <!-- FLOATING ACCESSIBILITY BUTTON (BOTTOM RIGHT) -->
        <button class="absolute bottom-6 right-28 w-14 h-14 rounded-full bg-sky-500 hover:bg-sky-400 border-2 border-white text-white flex items-center justify-center shadow-2xl z-40 transition transform hover:scale-105" title="Accessibility Options">
            <i class="fa-solid fa-universal-access text-2xl"></i>
        </button>
    </main>

    <!-- FOOTER CONTROLS -->
    <footer class="w-full px-6 py-2.5 flex flex-col md:flex-row items-center justify-between z-30 gap-3 relative">
        <div class="flex items-center space-x-4 w-full md:w-auto">
            <div class="flex items-center space-x-2">
                <button onclick="prevSlide()" class="w-9 h-9 rounded-full glass-circle-btn text-white flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button id="play-pause-btn" onclick="togglePlayPause()" class="w-9 h-9 rounded-full bg-qau-azure text-slate-900 font-black flex items-center justify-center shadow cursor-pointer">
                    <i class="fa-solid fa-pause text-xs" id="play-pause-icon"></i>
                </button>
                <button onclick="nextSlide()" class="w-9 h-9 rounded-full glass-circle-btn text-white flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="text-xs text-white font-semibold px-3.5 py-1.5 rounded-full bg-white/10 border border-white/20 flex items-center gap-2">
                <span class="text-qau-azure font-bold" id="current-slide-num">01</span>
                <span class="text-slate-400">/</span>
                <span id="total-slides-num">11</span>
                <span class="hidden sm:inline-block text-slate-200 font-medium ml-2 pl-2 border-l border-white/20" id="current-slide-title">Overview & Vision</span>
            </div>
        </div>

        <!-- Progress Bar & Timer Countdown -->
        <div class="flex-1 mx-4 max-w-xl w-full">
            <div class="flex justify-between items-center text-[10px] text-slate-300 mb-1 font-mono">
                <span id="slide-timer-mode" class="tracking-widest">AUTO-ADVANCE</span>
                <span id="timer-countdown" class="font-bold">60s</span>
            </div>
            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-qau-azure h-full rounded-full w-0 progress-bar-fill"></div>
            </div>
        </div>

        <!-- Direct Navigation Jump Dots -->
        <div class="flex items-center space-x-1.5 overflow-x-auto max-w-xs py-1" id="dots-container"></div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const heroBackgrounds = [
            "https://upload.wikimedia.org/wikipedia/commons/0/0f/Quaid-i-Azam_University_Entrance.JPG", 
            "vc-msg.JPG",  
            "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1920&q=80", 
            "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1920&q=80",
            "https://upload.wikimedia.org/wikipedia/commons/2/29/Quaid-i-Azam_University_Library.JPG",
            "hostel.jpg",
            "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1920&q=80",
            "https://upload.wikimedia.org/wikipedia/commons/0/0f/Quaid-i-Azam_University_Entrance.JPG"
        ];

        const slides = [
            {
                id: 1,
                title: "Overview & Vision",
                bg: heroBackgrounds[0],
                duration: 60,
                headline: "Pakistan's Premier Higher Education Institution",
                subtext: "Founded in 1967 at the Margalla foothills, Quaid-i-Azam University leads national scientific discovery and academic scholarship.",
                isOverview: true
            },
            {
                id: 2,
                title: "Vice-Chancellor's Address",
                bg: heroBackgrounds[1],
                duration: 60,
                headline: "Pioneering Academic Excellence & Global Innovation",
                subtext: "Prof. Dr. Zafar Nawaz Jaspal — Vice-Chancellor, Quaid-i-Azam University",
                isVC: true
            },
            {
                id: 3,
                title: "Faculty of Natural Sciences",
                bg: heroBackgrounds[2],
                duration: 60,
                headline: "Leading Theoretical & Applied Physical Sciences",
                subtext: "Physics, Chemistry, Computer Science, Mathematics, Statistics & Earth Sciences",
                items: ["Department of Physics", "Department of Computer Science", "Department of Chemistry", "Department of Mathematics"]
            },
            {
                id: 4,
                title: "Faculty of Biological Sciences",
                bg: heroBackgrounds[3],
                duration: 60,
                headline: "Advanced Molecular, Plant & Life Sciences Research",
                subtext: "Biochemistry, Microbiology, Pharmacy, Environmental Sciences, Zoology & Plant Sciences",
                items: ["National Center for Bioinformatics", "Department of Pharmacy", "Department of Biotechnology", "Department of Zoology"]
            },
            {
                id: 5,
                title: "Faculty of Social Sciences",
                bg: heroBackgrounds[4],
                duration: 60,
                headline: "Center for Strategic, Economic & Policy Research",
                subtext: "International Relations, Economics, Defence & Strategic Studies, History & Anthropology",
                items: ["School of Politics & IR", "Department of Economics", "Defence & Strategic Studies", "School of Anthropology"]
            },
            {
                id: 6,
                title: "Research & ORIC",
                bg: heroBackgrounds[5],
                duration: 60,
                headline: "The Engine of National Scientific & Technological Innovation",
                subtext: "Over PKR 500M+ active research grants, incubation hubs, and high-impact international journal output.",
                items: ["PKR 500M+ Annual Grants", "3,500+ Annual Research Publications", "Active Technology Incubation Hub", "60+ Registered Patents"]
            },
            {
                id: 7,
                title: "Admissions & Financial Aid",
                bg: heroBackgrounds[6],
                duration: 60,
                headline: "Open Merit Admissions & Comprehensive Scholarships",
                subtext: "Offering BS, MPhil & PhD programs with HEC Need-Based & Ehsaas Merit Scholarships.",
                items: ["BS 4-Year Undergraduate", "MPhil & MS Graduate Programs", "PhD Research Fellowships", "Ehsaas & HEC Scholarships"]
            },
            {
                id: 8,
                title: "Central Library Hub",
                bg: heroBackgrounds[7],
                duration: 60,
                headline: "Dr. Raziuddin Siddiqui Central Library",
                subtext: "Housing over 250,000 volumes, full digital repository access, and PERN high-speed connectivity.",
                items: ["250,000+ Printed Volumes", "HEC Digital Library Access", "24/7 Quiet Reading Lounges", "High-Speed PERN Wi-Fi"]
            },
            {
                id: 9,
                title: "Campus Life & Hostels",
                bg: heroBackgrounds[8],
                duration: 60,
                headline: "Vibrant Residential Campus Life in Margalla Foothills",
                subtext: "16 On-campus residential halls, sports complexes, transport fleet, and health services.",
                items: ["16 Student Residential Hostels", "Central Sports Complex", "Campus Bus Fleet", "24/7 Medical Center"]
            },
            {
                id: 10,
                title: "Societies & Co-Curriculars",
                bg: heroBackgrounds[9],
                duration: 60,
                headline: "Empowering Student Leadership & Creative Arts",
                subtext: "QAU Debating Society, Computing Society, Performing Arts, Adventure Club & Green Environmental Club.",
                items: ["QAU Debating & Literary Society", "Computing & AI Council", "Adventure & Hiking Club", "Performing Arts & Green Club"]
            },
            {
                id: 11,
                title: "Campus Video Showcase",
                bg: heroBackgrounds[10],
                duration: 170,
                headline: "Quaid-i-Azam University Aerial & Campus Tour",
                subtext: "Aerial showcase and virtual walkthrough of QAU Islamabad campus.",
                isVideo: true
            }
        ];

        let currentSlideIndex = 0;
        let isPlaying = true;
        let timeRemaining = slides[0].duration;
        let timerInterval = null;

        window.onload = function() {
            renderDots();
            renderThumbnails();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
        };

        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            const stage = document.getElementById('slide-stage');

            stage.style.backgroundImage = `linear-gradient(to right, rgba(15, 23, 42, 0.65) 0%, rgba(15, 23, 42, 0.25) 55%, rgba(15, 23, 42, 0.45) 100%), url('${currentSlide.bg}')`;

            if (currentSlide.isVideo) {
                stage.innerHTML = `
                    <div class="hero-enter h-full w-full p-8 md:p-10 flex flex-col justify-between relative z-10 pr-32">
                        <div class="max-w-2xl">
                            <span class="px-3 py-1 rounded-md bg-red-600 text-white text-xs font-bold uppercase tracking-widest mb-2 inline-block shadow">
                                <i class="fa-solid fa-play-circle mr-1"></i> 2m 50s Video Showcase
                            </span>
                            <h2 class="text-2xl md:text-4xl font-black text-white leading-tight tracking-tight drop-shadow-lg">${currentSlide.headline}</h2>
                            <p class="text-sm md:text-base text-slate-200 mt-1 drop-shadow">${currentSlide.subtext}</p>
                        </div>

                        <div class="relative w-full flex-1 mt-3 mb-1 bg-black/80 rounded-2xl border border-white/20 overflow-hidden shadow-2xl z-20 flex items-center justify-center">
                            <video id="qau-campus-video" class="w-full h-full object-cover" autoplay muted playsinline controls>
                                <source src="qau-1.mp4" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                `;
            } else {
                stage.innerHTML = `
                    <div class="hero-enter h-full w-full flex justify-between items-center relative z-10 pl-8 md:pl-14 pr-32">
                        <div class="max-w-2xl my-auto py-6 pr-4">
                            ${currentSlide.isOverview ? `
                                <div class="flex flex-wrap items-center gap-3 mb-4">
                                    <div class="glass-badge px-4 py-2 rounded-full flex items-center gap-2.5 text-amber-300 font-extrabold text-xs uppercase tracking-wider shadow-lg">
                                        <i class="fa-solid fa-trophy text-amber-400 text-base"></i>
                                        <span>Ranked #1 University in Pakistan (HEC)</span>
                                    </div>
                                    <div class="glass-badge px-4 py-2 rounded-full flex items-center gap-2.5 text-qau-azure font-extrabold text-xs uppercase tracking-wider shadow-lg">
                                        <i class="fa-solid fa-globe text-qau-azure text-base"></i>
                                        <span>Top 500 QS World University Ranking</span>
                                    </div>
                                </div>
                            ` : ''}

                            <h2 class="text-3xl md:text-5xl lg:text-6xl font-black text-white leading-[1.12] tracking-tight drop-shadow-lg">
                                ${currentSlide.headline}
                            </h2>
                            <p class="text-base md:text-xl text-slate-100 mt-4 max-w-xl font-medium drop-shadow-md leading-relaxed">
                                ${currentSlide.subtext}
                            </p>
                            
                            ${currentSlide.isOverview ? `
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-6 max-w-xl">
                                    <div class="glass-card-dark p-3.5 rounded-xl border-l-4 border-l-amber-400">
                                        <div class="text-2xl font-black text-amber-400">#1 Rank</div>
                                        <div class="text-[10px] uppercase font-bold text-slate-200 mt-0.5">HEC Official Ranking</div>
                                    </div>
                                    <div class="glass-card-dark p-3.5 rounded-xl border-l-4 border-l-qau-azure">
                                        <div class="text-2xl font-black text-qau-azure">Top 500</div>
                                        <div class="text-[10px] uppercase font-bold text-slate-200 mt-0.5">QS World Ranking</div>
                                    </div>
                                    <div class="glass-card-dark p-3.5 rounded-xl border-l-4 border-l-emerald-400">
                                        <div class="text-2xl font-black text-emerald-400">13,000+</div>
                                        <div class="text-[10px] uppercase font-bold text-slate-200 mt-0.5">Enrolled Students</div>
                                    </div>
                                </div>
                            ` : ''}

                            ${currentSlide.isVC ? `
                                <div class="mt-6 glass-card-dark p-5 rounded-2xl border border-white/30 flex flex-col sm:flex-row items-center gap-5 max-w-2xl shadow-2xl">
                                    <div class="w-24 h-24 rounded-full border-2 border-qau-azure overflow-hidden shrink-0 shadow-lg bg-slate-800">
                                        <img src="vc.png" alt="Prof. Dr. Zafar Nawaz Jaspal" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://qau.edu.pk/wp-content/uploads/2026/08/21082026new22.jpg';">
                                    </div>
                                    <div>
                                        <p class="text-sm italic text-slate-100 font-serif leading-relaxed drop-shadow">
                                            "Quaid-i-Azam University remains committed to academic rigour, high-impact scientific research, and serving as the flagship institution of higher learning in Pakistan."
                                        </p>
                                        <div class="mt-3 text-xs font-bold text-qau-azure uppercase tracking-wider">
                                            — Prof. Dr. Zafar Nawaz Jaspal (Vice Chancellor)
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            ${currentSlide.items ? `
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6 max-w-xl">
                                    ${currentSlide.items.map(item => `
                                        <div class="glass-card-dark px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-100 flex items-center space-x-2">
                                            <i class="fa-solid fa-circle-check text-qau-azure"></i>
                                            <span>${item}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateDots();
            updateThumbnails();
            updateProgressBar();

            if (currentSlide.isVideo) {
                setTimeout(() => {
                    const videoElem = document.getElementById('qau-campus-video');
                    if (videoElem) {
                        videoElem.play().catch(e => console.log('Autoplay handled:', e));
                        videoElem.onended = () => nextSlide();
                    }
                }, 200);
            }
        }

        function renderThumbnails() {
            const container = document.getElementById('sidebar-thumbnails');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = `circle-thumb-item ${index === currentSlideIndex ? 'active' : ''}`;
                thumb.onclick = () => loadSlide(index);
                thumb.title = slide.title;
                thumb.innerHTML = `<img src="${slide.bg}" class="w-full h-full object-cover">`;
                container.appendChild(thumb);
            });
        }

        function updateThumbnails() {
            const thumbs = document.getElementById('sidebar-thumbnails').children;
            Array.from(thumbs).forEach((thumb, index) => {
                if (index === currentSlideIndex) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSlide = slides[currentSlideIndex];
            if (currentSlide.isVideo) {
                const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                const secs = String(timeRemaining % 60).padStart(2, '0');
                document.getElementById('timer-countdown').innerText = `${mins}:${secs}`;
                document.getElementById('slide-timer-mode').innerText = 'VIDEO SHOWCASE';
            } else {
                document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;
                document.getElementById('slide-timer-mode').innerText = 'AUTO-ADVANCE';
            }
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            if (isPlaying) {
                btnIcon.className = 'fa-solid fa-pause text-xs';
            } else {
                btnIcon.className = 'fa-solid fa-play text-xs';
            }

            const videoElem = document.getElementById('qau-campus-video');
            if (videoElem) {
                isPlaying ? videoElem.play() : videoElem.pause();
            }
        }

        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 cursor-pointer ${index === currentSlideIndex ? 'bg-qau-azure w-6' : 'bg-white/40 hover:bg-white/70'}`;
                dot.onclick = () => loadSlide(index);
                dot.title = `Slide ${slide.id}: ${slide.title}`;
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, index) => {
                if (index === currentSlideIndex) {
                    dot.className = 'w-6 h-2.5 rounded-full bg-qau-azure transition-all duration-300';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-white/40 hover:bg-white/70 transition-all duration-300';
                }
            });
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');
                
                const clockElem = document.getElementById('digital-clock');
                if (clockElem) {
                    clockElem.innerText = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
                }

                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                const dateElem = document.getElementById('digital-date');
                if (dateElem) {
                    dateElem.innerText = now.toLocaleDateString('en-US', options);
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
