        }

        .glass-badge {

            transform: scale(1.05);
        }

        /* RESPONSIVE DOCK CONTAINER */
        .sidebar-right-nav {
            position: absolute;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Vertical layout on Desktop (lg+) */
        @media (min-width: 1024px) {
            .sidebar-right-nav {
                right: 0;
                top: 0;
                bottom: 0;
                width: 110px;
                flex-direction: column;
                background: linear-gradient(to left, rgba(3, 7, 18, 0.85), transparent);
            }
        }

        /* Horizontal layout on Mobile/Tablet (<1024px) */
        @media (max-width: 1023px) {
            .sidebar-right-nav {
                bottom: 8px;
                left: 0;
                right: 0;
                height: 70px;
                flex-direction: row;
                overflow-x: auto;
                padding: 0 16px;
                background: linear-gradient(to top, rgba(3, 7, 18, 0.9), transparent);
            }
            .active-curve-backdrop {
                display: none !important;
            }
        }

        .thumb-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            shrink: 0;
        }

        .circle-thumb-item {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #0b1d3a;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .circle-thumb-item {
                width: 54px;
                height: 54px;
            }
        }

        .circle-thumb-item:hover {
            transform: scale(1.15);
            border-color: #38bdf8;
        }

        .circle-thumb-item.active {
            width: 54px;
            height: 54px;
            border: 3.5px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7), 0 8px 24px rgba(0, 0, 0, 0.7);
            transform: scale(1.08);
        }

        @media (min-width: 768px) {
            .circle-thumb-item.active {
                width: 66px;
                height: 66px;
            }
        }

        .active-curve-backdrop {
            position: absolute;
            right: 0;
            width: 85px;
            height: 84px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top-left-radius: 42px;
            border-bottom-left-radius: 42px;
            pointer-events: none;
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            border-left: 2px solid rgba(245, 158, 11, 0.5);
        }

        .hero-enter {
            animation: heroFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .progress-bar-fill {
            transition: width 0.1s linear;

            width: 5px;
            height: 5px;

            renderDots();
            renderThumbnails();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
        };

        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            const stage = document.getElementById('slide-stage');

            stage.style.backgroundPosition = (currentSlide.bg === 'bab1.jpg' || index === 0) ? 'center top' : 'center center';
            stage.style.backgroundImage = `linear-gradient(to right, rgba(11, 16, 36, 0.88) 0%, rgba(11, 16, 36, 0.55) 55%, rgba(11, 16, 36, 0.82) 100%), url('${currentSlide.bg}')`;

            stage.innerHTML = `<div class="w-full h-full hero-enter overflow-y-auto custom-scroll flex flex-col justify-center p-4 md:p-6 lg:p-8 pb-20 lg:pb-8 lg:pr-32">${currentSlide.render()}</div>`;

            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateDots();
            updateThumbnails();
            updateProgressBar();

            if (currentSlide.isVideo) {
                setTimeout(() => {
                    const videoElem = document.getElementById('qau-campus-video');
                    if (videoElem) {
                        videoElem.muted = true;
                        videoElem.play().catch(e => console.log('Autoplay handled:', e));
                        videoElem.onended = () => nextSlide();
                    }
                }, 300);
            }

            setTimeout(() => {
                if (document.getElementById('quota-chart-canvas')) {
                    initQuotaChart();
                }

        // DOCK THUMBNAILS & CONTROLS
        function renderThumbnails() {
            const container = document.getElementById('sidebar-thumbnails');
            const backdrop = document.getElementById('active-curve-backdrop');

            container.innerHTML = '';
            if (backdrop) container.appendChild(backdrop);

            slides.forEach((slide, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'thumb-wrapper';

                const thumb = document.createElement('div');
                thumb.className = `circle-thumb-item ${index === currentSlideIndex ? 'active' : ''}`;
                thumb.onclick = () => loadSlide(index);
                thumb.title = slide.title;
                thumb.innerHTML = `<img src="${slide.bg}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${slide.id}&background=0b1d3a&color=f59e0b';">`;

                wrapper.appendChild(thumb);
                container.appendChild(wrapper);
            });
        }

        function updateThumbnails() {
            const wrappers = document.querySelectorAll('.thumb-wrapper');
            const backdrop = document.getElementById('active-curve-backdrop');

            wrappers.forEach((wrapper, index) => {
                const thumb = wrapper.querySelector('.circle-thumb-item');
                if (index === currentSlideIndex) {
                    thumb.classList.add('active');
                    if (backdrop && wrapper.offsetTop && window.innerWidth >= 1024) {
                        backdrop.style.top = `${wrapper.offsetTop - 8}px`;
                    }
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSlide = slides[currentSlideIndex];
            if (currentSlide.isVideo) {
                const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                const secs = String(timeRemaining % 60).padStart(2, '0');
                document.getElementById('timer-countdown').innerText = `${mins}:${secs}`;
                document.getElementById('slide-timer-mode').innerText = 'VIDEO SHOWCASE';
            } else {
                document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;
                document.getElementById('slide-timer-mode').innerText = 'AUTO ADVANCE';
            }
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            btnIcon.className = isPlaying ? 'fa-solid fa-pause text-xs' : 'fa-solid fa-play text-xs';

            const videoElem = document.getElementById('qau-campus-video');
            if (videoElem) {
                isPlaying ? videoElem.play() : videoElem.pause();
            }
        }

        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 cursor-pointer ${index === currentSlideIndex ? 'bg-amber-400 w-6' : 'bg-white/30 hover:bg-white/70'}`;
                dot.onclick = () => loadSlide(index);
                dot.title = `Slide ${slide.id}: ${slide.title}`;
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, index) => {
                dot.className = index === currentSlideIndex 
                    ? 'w-6 h-2.5 rounded-full bg-amber-400 transition-all duration-300' 
                    : 'w-2.5 h-2.5 rounded-full bg-white/30 hover:bg-white/70 transition-all duration-300';
            });
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                
                const clockElem = document.getElementById('digital-clock');
                if (clockElem) {
                    clockElem.innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
                }

                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                const dateElem = document.getElementById('digital-date');
                if (dateElem) {
                    dateElem.innerText = now.toLocaleDateString('en-US', options);
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onresize = function() {
            updateThumbnails();
        };
    </script>
</body>
</html>
