<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaid-i-Azam University Showcase - Boğaziçi Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qau: {
                            navy: '#0F2B5B',
                            gold: '#F59E0B',
                            azure: '#00A8E8',
                            emerald: '#10B981',
                            dark: '#080C14'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050811;
            color: #FFFFFF;
            overflow: hidden;
            user-select: none;
        }

        /* Hero Background Dynamic Switcher */
        .hero-bg-container {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Boğaziçi Glassmorphism top buttons */
        .top-action-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.25s ease;
            cursor: pointer;
            shrink: 0;
        }
        .top-action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .glass-badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-card-dark {
            background: rgba(8, 12, 20, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           EXACT BOĞAZİÇİ CURVED RIGHT NOTCH & SIDEBAR STYLING
           ========================================================================== */
        .bogazici-sidebar-wrap {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 120px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 0px;
        }

        /* The vertical container holding all thumbnails */
        .thumb-list-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 10;
            padding-right: 12px;
        }

        /* Individual thumbnail item wrapper */
        .thumb-item-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            cursor: pointer;
        }

        /* The circle thumbnail image */
        .thumb-circle {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            overflow: hidden;
            border: 2.5px solid rgba(255, 255, 255, 0.65);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 10;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            background-color: #0b1120;
        }

        .thumb-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .thumb-item-wrapper:hover .thumb-circle {
            transform: scale(1.08);
            border-color: #00A8E8;
        }

        /* Active State - Matches exact white glow cutout / popping effect */
        .thumb-item-wrapper.active .thumb-circle {
            width: 78px;
            height: 78px;
            border: 3.5px solid #FFFFFF;
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.85), 0 8px 22px rgba(0, 0, 0, 0.6);
            transform: scale(1.05);
        }

        /* Curved White Notch Background Element behind Active Thumbnail */
        .active-notch-bg {
            position: absolute;
            right: 0;
            width: 96px;
            height: 96px;
            background: #FFFFFF;
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
            z-index: 5;
            box-shadow: -8px 0 20px rgba(0, 0, 0, 0.3);
            transition: top 0.35s cubic-bezier(0.34, 1.25, 0.64, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Top and Bottom Smooth Inward Curve Corners (Mask effect) */
        .active-notch-bg::before {
            content: '';
            position: absolute;
            top: -20px;
            right: 0;
            width: 20px;
            height: 20px;
            background: transparent;
            border-bottom-right-radius: 16px;
            box-shadow: 6px 6px 0 6px #FFFFFF;
        }

        .active-notch-bg::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: 0;
            width: 20px;
            height: 20px;
            background: transparent;
            border-top-right-radius: 16px;
            box-shadow: 6px -6px 0 6px #FFFFFF;
        }

        /* Floating Accessibility Button styling matching user screenshot - FIXED POSITIONING */
        .accessibility-float-btn {
            position: absolute;
            bottom: 20px;
            right: 125px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #00A8E8;
            border: 3px solid #FFFFFF;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 168, 232, 0.5), 0 4px 12px rgba(0,0,0,0.3);
            z-index: 45;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .accessibility-float-btn:hover {
            transform: scale(1.1);
            background: #0093CD;
            box-shadow: 0 12px 35px rgba(0, 168, 232, 0.7);
        }

        /* Slide indicator pills at bottom center */
        .pagination-pill {
            height: 8px;
            border-radius: 20px;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .pagination-pill.active {
            width: 32px;
            background-color: #00A8E8;
        }

        .pagination-pill.inactive {
            width: 8px;
            background-color: rgba(255, 255, 255, 0.35);
        }
        .pagination-pill.inactive:hover {
            background-color: rgba(255, 255, 255, 0.65);
        }

        .hero-fade-enter {
            animation: heroFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-3 md:p-4 bg-slate-950 text-white overflow-hidden relative">

    <!-- TOP BAR / HEADER -->
    <header class="w-full px-3 md:px-6 py-2 flex items-center justify-between z-30 relative shrink-0">
        <!-- University Logo & Title -->
        <div class="flex items-center space-x-3.5">
            <button class="text-white hover:text-qau-azure text-xl transition-colors cursor-pointer mr-1" title="Main Navigation Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full bg-white p-1 flex items-center justify-center shadow-md border border-white/40 overflow-hidden shrink-0">
                    <img src="logo.jpg" alt="QAU Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/120x120/0F2B5B/FFFFFF?text=QAU';">
                </div>
                <div class="leading-tight">
                    <h1 class="text-lg md:text-xl font-black tracking-wider text-white uppercase drop-shadow-sm">
                        Quaid-i-Azam University
                    </h1>
                    <p class="text-[10px] text-slate-300 font-bold tracking-widest uppercase">Islamabad, Pakistan</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Weather, Clock & Exact Boğaziçi Top Action Buttons -->
        <div class="flex items-center space-x-3">
            <!-- Weather Widget -->
            <div class="hidden lg:flex items-center space-x-3 glass-badge px-3.5 py-1.5 rounded-xl shadow-sm">
                <i class="fa-solid fa-cloud-sun text-qau-azure text-lg"></i>
                <div class="text-left">
                    <div class="text-[9px] text-slate-300 uppercase tracking-widest font-bold">Islamabad, PK</div>
                    <div class="text-xs font-bold text-white">24°C • Sunny</div>
                </div>
            </div>

            <!-- Digital Clock Badge -->
            <div class="hidden sm:block glass-badge px-3.5 py-1.5 rounded-xl text-right shadow-sm border-l-2 border-l-qau-azure">
                <div class="text-xs font-black tracking-wider text-qau-azure font-mono" id="digital-clock">00:00:00 AM</div>
                <div class="text-[9px] uppercase tracking-widest text-slate-300 font-semibold" id="digital-date">Tuesday, 27 Oct 2026</div>
            </div>

            <!-- BOĞAZİÇİ EXACT TOP RIGHT GLASS ICON BUTTONS -->
            <div class="flex items-center space-x-1.5">
                <button class="top-action-btn" title="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="top-action-btn" title="Share Page">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button class="top-action-btn" title="User Profile / Portal">
                    <i class="fa-solid fa-user"></i>
                </button>
                <button class="top-action-btn tracking-wider font-extrabold text-xs" title="Language Switcher">
                    TR
                </button>
                <button onclick="toggleFullScreen()" class="top-action-btn" title="Fullscreen Mode">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN HERO STAGE -->
    <main class="flex-1 relative z-10 overflow-hidden rounded-2xl border border-white/20 shadow-2xl my-1 mx-1 md:mx-3">
        <div id="slide-stage" class="w-full h-full relative hero-bg-container">
            <!-- Content Dynamically Populated by JS -->
        </div>

        <!-- EXACT BOĞAZİÇİ CURVED RIGHT NOTCH SIDEBAR -->
        <div class="bogazici-sidebar-wrap">
            <!-- Dynamic notch cutout element -->
            <div id="active-notch-bg" class="active-notch-bg"></div>

            <div class="thumb-list-container" id="thumb-list-container">
                <!-- Circular Thumbnails generated dynamically by JS -->
            </div>
        </div>

        <!-- FLOATING ACCESSIBILITY BUTTON (POSITIONED SAFELY TO AVOID TEXT OVERLAP) -->
        <button class="accessibility-float-btn" title="Accessibility Options" onclick="toggleAccessibilityMenu()">
            <i class="fa-solid fa-universal-access text-xl"></i>
        </button>
    </main>

    <!-- FOOTER CONTROLS & PAGINATION -->
    <footer class="w-full px-4 py-2 flex flex-col md:flex-row items-center justify-between z-30 gap-3 relative shrink-0">
        <!-- Left: Slide Navigation Controls & Meta -->
        <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center space-x-1.5">
                <button onclick="prevSlide()" class="w-8 h-8 rounded-full glass-badge hover:bg-white/30 text-white flex items-center justify-center cursor-pointer transition">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>
                <button id="play-pause-btn" onclick="togglePlayPause()" class="w-8 h-8 rounded-full bg-qau-azure text-slate-950 font-black flex items-center justify-center shadow-md cursor-pointer hover:bg-sky-400 transition">
                    <i class="fa-solid fa-pause text-[10px]" id="play-pause-icon"></i>
                </button>
                <button onclick="nextSlide()" class="w-8 h-8 rounded-full glass-badge hover:bg-white/30 text-white flex items-center justify-center cursor-pointer transition">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>

            <div class="text-xs text-white font-semibold px-3.5 py-1.5 rounded-full glass-badge flex items-center gap-2">
                <span class="text-qau-azure font-extrabold text-xs" id="current-slide-num">01</span>
                <span class="text-slate-400 text-[10px]">/</span>
                <span id="total-slides-num" class="text-slate-300 text-xs">05</span>
                <span class="hidden sm:inline-block text-slate-200 font-medium ml-2 pl-2 border-l border-white/20 text-xs max-w-[180px] truncate" id="current-slide-title">Overview & Vision</span>
            </div>
        </div>

        <!-- Center: EXACT BOĞAZİÇİ PILL PAGINATION DOTS -->
        <div class="flex items-center justify-center space-x-2 my-0.5" id="pagination-pills-container">
            <!-- Generated via JS -->
        </div>

        <!-- Right: Auto-Advance Progress Indicator -->
        <div class="w-full md:w-56 max-w-xs">
            <div class="flex justify-between items-center text-[9px] text-slate-300 mb-1 font-mono">
                <span class="tracking-widest">AUTO-ADVANCE</span>
                <span id="timer-countdown" class="font-bold text-qau-azure">15s</span>
            </div>
            <div class="w-full bg-white/20 h-1 rounded-full overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-qau-azure h-full rounded-full w-0 transition-all duration-100 ease-linear"></div>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const heroBackgrounds = [
            "bab.jpg",
            "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1600&q=80",
            "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1600&q=80",
            "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1600&q=80",
            "lib.jpg"
        ];

        const slides = [
            {
                id: 1,
                title: "Graduation & Campus Life",
                bg: heroBackgrounds[0],
                duration: 15,
                headline: "Pakistan's Premier Higher Education Institution",
                subtext: "Founded in 1967 at the foothills of Margalla Hills, Quaid-i-Azam University stands as the nation's leader in academic research.",
                isOverview: true
            },
            {
                id: 2,
                title: "Vice-Chancellor's Vision",
                bg: heroBackgrounds[1],
                duration: 15,
                headline: "Pioneering Research & Academic Excellence",
                subtext: "Prof. Dr. Zafar Nawaz Jaspal — Vice-Chancellor, Quaid-i-Azam University",
                isVC: true
            },
            {
                id: 3,
                title: "Faculty of Natural Sciences",
                bg: heroBackgrounds[2],
                duration: 15,
                headline: "Leading Edge Applied & Physical Research",
                subtext: "Physics, Chemistry, Computer Science, Mathematics, Statistics & Earth Sciences",
                items: ["Department of Physics", "Department of Computer Science", "Department of Chemistry", "Department of Mathematics"]
            },
            {
                id: 4,
                title: "Faculty of Biological Sciences",
                bg: heroBackgrounds[3],
                duration: 15,
                headline: "Molecular, Plant & Advanced Life Sciences",
                subtext: "Biochemistry, Microbiology, Pharmacy, Environmental Sciences, Biotechnology & Zoology",
                items: ["National Center for Bioinformatics", "Department of Pharmacy", "Department of Biotechnology", "Department of Zoology"]
            },
            {
                id: 5,
                title: "Faculty of Social Sciences",
                bg: heroBackgrounds[4],
                duration: 15,
                headline: "Global Policy, Governance & Social Research",
                subtext: "International Relations, Economics, Defence Studies, History & Anthropology",
                items: ["School of Politics & IR", "Department of Economics", "Defence & Strategic Studies", "School of Anthropology"]
            }
        ];

        let currentSlideIndex = 0;
        let isPlaying = true;
        let timeRemaining = slides[0].duration;
        let timerInterval = null;

        window.onload = function() {
            renderThumbnails();
            renderPaginationPills();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
            window.addEventListener('resize', updateNotchPosition);
        };

        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            const stage = document.getElementById('slide-stage');

            stage.style.backgroundImage = `linear-gradient(to right, rgba(5, 8, 17, 0.88) 0%, rgba(5, 8, 17, 0.45) 55%, rgba(5, 8, 17, 0.65) 100%), url('${currentSlide.bg}')`;

            stage.innerHTML = `
                <div class="hero-fade-enter h-full w-full flex justify-between items-center relative z-10 pl-6 md:pl-12 pr-32">
                    <div class="max-w-xl lg:max-w-2xl my-auto py-4">
                        ${currentSlide.isOverview ? `
                            <div class="flex flex-wrap items-center gap-2.5 mb-3">
                                <div class="glass-badge px-3 py-1.5 rounded-full flex items-center gap-2 border-amber-400/50 text-amber-300 font-extrabold text-[11px] uppercase tracking-wider shadow">
                                    <i class="fa-solid fa-trophy text-amber-400 text-xs"></i>
                                    <span>#1 Ranked University in Pakistan</span>
                                </div>
                                <div class="glass-badge px-3 py-1.5 rounded-full flex items-center gap-2 border-qau-azure/50 text-qau-azure font-extrabold text-[11px] uppercase tracking-wider shadow">
                                    <i class="fa-solid fa-globe text-qau-azure text-xs"></i>
                                    <span>Top 500 QS World Ranking</span>
                                </div>
                            </div>
                        ` : ''}

                        <h2 class="text-2xl md:text-4xl lg:text-5xl font-black text-white leading-[1.15] tracking-tight drop-shadow-md">
                            ${currentSlide.headline}
                        </h2>
                        <p class="text-xs md:text-base text-slate-200 mt-3 max-w-lg font-medium drop-shadow leading-relaxed">
                            ${currentSlide.subtext}
                        </p>

                        ${currentSlide.isOverview ? `
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-5 max-w-md">
                                <div class="glass-card-dark p-3 rounded-xl border-l-4 border-l-amber-400">
                                    <div class="text-xl font-black text-amber-400">#1 Rank</div>
                                    <div class="text-[9px] uppercase font-bold text-slate-300 mt-0.5">HEC National Ranking</div>
                                </div>
                                <div class="glass-card-dark p-3 rounded-xl border-l-4 border-l-qau-azure">
                                    <div class="text-xl font-black text-qau-azure">Top 500</div>
                                    <div class="text-[9px] uppercase font-bold text-slate-300 mt-0.5">QS Global Ranking</div>
                                </div>
                                <div class="glass-card-dark p-3 rounded-xl border-l-4 border-l-emerald-400">
                                    <div class="text-xl font-black text-emerald-400">13,000+</div>
                                    <div class="text-[9px] uppercase font-bold text-slate-300 mt-0.5">Active Students</div>
                                </div>
                            </div>
                        ` : ''}

                        ${currentSlide.isVC ? `
                            <div class="mt-5 glass-card-dark p-4 rounded-xl border border-white/20 flex flex-col sm:flex-row items-center gap-4 max-w-lg shadow-xl">
                                <div class="w-16 h-16 rounded-full border-2 border-qau-azure overflow-hidden shrink-0 shadow-md">
                                    <img src="vc-photo.jpg" alt="VC QAU" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/200x200/0F2B5B/FFFFFF?text=VC+QAU';">
                                </div>
                                <div>
                                    <p class="text-xs italic text-slate-200 font-serif leading-relaxed">
                                        "Quaid-i-Azam University remains committed to academic rigour, high-impact research, and serving as the flagship academic institution in Pakistan."
                                    </p>
                                    <div class="mt-1.5 text-[11px] font-bold text-qau-azure uppercase tracking-wider">
                                        — Prof. Dr. Zafar Nawaz Jaspal (Vice Chancellor)
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        ${currentSlide.items ? `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-5 max-w-lg">
                                ${currentSlide.items.map(item => `
                                    <div class="glass-card-dark px-3.5 py-2 rounded-lg text-xs font-semibold text-slate-100 flex items-center space-x-2">
                                        <i class="fa-solid fa-circle-check text-qau-azure text-xs"></i>
                                        <span>${item}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateThumbnailsState();
            updatePaginationPillsState();
            updateProgressBar();
        }

        /* Render Boğaziçi Right Sidebar Circular Thumbnails */
        function renderThumbnails() {
            const container = document.getElementById('thumb-list-container');
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `thumb-item-wrapper ${index === currentSlideIndex ? 'active' : ''}`;
                wrapper.id = `thumb-wrapper-${index}`;
                wrapper.onclick = () => loadSlide(index);
                wrapper.title = slide.title;

                wrapper.innerHTML = `
                    <div class="thumb-circle">
                        <img src="${slide.bg}" alt="${slide.title}">
                    </div>
                `;

                container.appendChild(wrapper);
            });

            setTimeout(updateNotchPosition, 50);
        }

        /* Dynamically aligns the curved cutout notch with the active thumbnail */
        function updateNotchPosition() {
            const activeWrapper = document.getElementById(`thumb-wrapper-${currentSlideIndex}`);
            const notch = document.getElementById('active-notch-bg');

            if (activeWrapper && notch) {
                const topOffset = activeWrapper.offsetTop + (activeWrapper.offsetHeight / 2) - (notch.offsetHeight / 2);
                notch.style.top = `${topOffset}px`;
            }
        }

        function updateThumbnailsState() {
            slides.forEach((_, index) => {
                const elem = document.getElementById(`thumb-wrapper-${index}`);
                if (elem) {
                    if (index === currentSlideIndex) {
                        elem.classList.add('active');
                    } else {
                        elem.classList.remove('active');
                    }
                }
            });

            updateNotchPosition();
        }

        /* Render Boğaziçi Bottom Pill Pagination Dots */
        function renderPaginationPills() {
            const container = document.getElementById('pagination-pills-container');
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const pill = document.createElement('div');
                pill.className = `pagination-pill ${index === currentSlideIndex ? 'active' : 'inactive'}`;
                pill.id = `pill-${index}`;
                pill.onclick = () => loadSlide(index);
                pill.title = slide.title;
                container.appendChild(pill);
            });
        }

        function updatePaginationPillsState() {
            slides.forEach((_, index) => {
                const pill = document.getElementById(`pill-${index}`);
                if (pill) {
                    if (index === currentSlideIndex) {
                        pill.className = 'pagination-pill active';
                    } else {
                        pill.className = 'pagination-pill inactive';
                    }
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            if (isPlaying) {
                btnIcon.className = 'fa-solid fa-pause text-xs';
            } else {
                btnIcon.className = 'fa-solid fa-play text-xs';
            }
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');

                const clockElem = document.getElementById('digital-clock');
                if (clockElem) {
                    clockElem.innerText = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
                }

                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                const dateElem = document.getElementById('digital-date');
                if (dateElem) {
                    dateElem.innerText = now.toLocaleDateString('en-US', options);
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleAccessibilityMenu() {
            const currentTitle = slides[currentSlideIndex].title;
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-24 left-8 bg-sky-500 text-white px-5 py-3 rounded-2xl shadow-2xl font-bold text-xs z-50 flex items-center gap-3 border border-white/40 hero-fade-enter';
            notification.innerHTML = `<i class="fa-solid fa-universal-access text-lg"></i> Accessibility Menu Active`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2500);
        }
    </script>
</body>
</html>
