<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaid-i-Azam University (QAU) - Digital Kiosk Signage (Boğaziçi Hero Layout)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        boun: {
                            navy: '#0F2B5B',       // Boğaziçi Primary Deep Blue
                            azure: '#27ACE2',      // Sky/Bright Blue Accent
                            overlay: 'rgba(15, 43, 91, 0.45)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            overflow: hidden;
            user-select: none;
        }

        /* Hero Background Styling */
        .hero-bg-container {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.6s ease-in-out;
        }

        /* Glass Utility Circle Buttons (Matching top right Boğaziçi Header) */
        .glass-circle-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease;
        }
        .glass-circle-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        /* Right Circular Thumbnail Selector */
        .circle-thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .circle-thumb.active {
            border-color: #27ACE2;
            transform: scale(1.18);
            box-shadow: 0 0 15px rgba(39, 172, 226, 0.8);
        }

        /* Slide Animation */
        .hero-enter {
            animation: heroFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 bg-slate-950 text-white overflow-hidden relative">

    <!-- HEADER / TOP BAR (Boğaziçi Web Header Style) -->
    <header class="w-full px-6 py-3 flex items-center justify-between z-30 relative">
        <!-- Left: Menu Icon & Logo -->
        <div class="flex items-center space-x-5">
            <button class="text-white hover:text-boun-azure text-2xl transition-colors">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full bg-white p-1 flex items-center justify-center shadow-md border border-white/30 overflow-hidden">
                    <img src="logo.jpg" alt="QAU Logo" class="w-full h-full object-contain">
                </div>
                <div class="leading-tight">
                    <h1 class="text-lg md:text-xl font-black tracking-wider text-white uppercase">
                        Quaid-i-Azam University
                    </h1>
                    <p class="text-[10px] text-slate-300 font-semibold tracking-widest uppercase">Islamabad, Pakistan</p>
                </div>
            </div>
        </div>

        <!-- Right: Utility Circle Buttons & Clock -->
        <div class="flex items-center space-x-3">
            <div class="hidden lg:flex text-right mr-3">
                <div class="text-sm font-black font-mono text-boun-azure" id="digital-clock">00:00:00 AM</div>
                <div class="text-[9px] uppercase tracking-widest text-slate-300 font-medium" id="digital-date">Monday, 26 Oct 2026</div>
            </div>

            <button class="w-10 h-10 rounded-full glass-circle-btn text-white flex items-center justify-center" title="Search">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-full glass-circle-btn text-white flex items-center justify-center" title="Share">
                <i class="fa-solid fa-share-nodes text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-full glass-circle-btn text-white flex items-center justify-center" title="User Portal">
                <i class="fa-solid fa-user text-sm"></i>
            </button>
            <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-full glass-circle-btn text-white flex items-center justify-center" title="Fullscreen">
                <i class="fa-solid fa-expand text-sm"></i>
            </button>
        </div>
    </header>

    <!-- MAIN HERO STAGE CONTAINER -->
    <main class="flex-1 relative z-10 overflow-hidden rounded-2xl border border-white/20 shadow-2xl my-2">
        <div id="slide-stage" class="w-full h-full relative hero-bg-container">
            <!-- Dynamic Slide Hero Content Rendered Here -->
        </div>
    </main>

    <!-- FOOTER / KIOSK CONTROLS & NAV BAR -->
    <footer class="w-full px-6 py-2.5 flex flex-col md:flex-row items-center justify-between z-30 gap-3 relative">
        <div class="flex items-center space-x-4 w-full md:w-auto">
            <div class="flex items-center space-x-2">
                <button onclick="prevSlide()" class="w-9 h-9 rounded-full glass-circle-btn text-white flex items-center justify-center">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button id="play-pause-btn" onclick="togglePlayPause()" class="w-9 h-9 rounded-full bg-boun-azure text-slate-900 font-black flex items-center justify-center shadow">
                    <i class="fa-solid fa-pause text-xs" id="play-pause-icon"></i>
                </button>
                <button onclick="nextSlide()" class="w-9 h-9 rounded-full glass-circle-btn text-white flex items-center justify-center">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="text-xs text-white font-semibold px-3 py-1.5 rounded-full bg-white/10 border border-white/20 flex items-center gap-2">
                <span class="text-boun-azure font-bold" id="current-slide-num">01</span>
                <span class="text-slate-400">/</span>
                <span id="total-slides-num">11</span>
                <span class="hidden sm:inline-block text-slate-200 font-medium ml-2 pl-2 border-l border-white/20" id="current-slide-title">Overview & Vision</span>
            </div>
        </div>

        <div class="flex-1 mx-4 max-w-xl w-full">
            <div class="flex justify-between items-center text-[10px] text-slate-300 mb-1 font-mono">
                <span id="slide-timer-mode">AUTO-ADVANCE</span>
                <span id="timer-countdown">60s</span>
            </div>
            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-boun-azure h-full rounded-full w-0 progress-bar-fill"></div>
            </div>
        </div>

        <div class="flex items-center space-x-1.5 overflow-x-auto max-w-xs py-1" id="dots-container"></div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const heroBackgrounds = [
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_0",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_1",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_2",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_3",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_4",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_5",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_6",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_7",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_8",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_9",
            "http://googleusercontent.com/image_collection/image_retrieval/2098804714458558925_10"
        ];

        const slides = [
            {
                id: 1,
                title: "Overview & Vision",
                bg: heroBackgrounds[0],
                duration: 60,
                headline: "Pakistan's Most Established Research University",
                subtext: "Established in 1967 in the foothills of Margalla, Islamabad."
            },
            {
                id: 2,
                title: "Vice-Chancellor's Address",
                bg: heroBackgrounds[1],
                duration: 60,
                headline: "Pioneering Academic Excellence & Leadership",
                subtext: "Prof. Dr. Zafar Nawaz Jaspal — Vice Chancellor, Quaid-i-Azam University"
            },
            {
                id: 3,
                title: "Faculty of Natural Sciences",
                bg: heroBackgrounds[2],
                duration: 60,
                headline: "Leading Theoretical & Applied Sciences",
                subtext: "Physics, Chemistry, Computer Science, Mathematics & Earth Sciences"
            },
            {
                id: 4,
                title: "Faculty of Biological Sciences",
                bg: heroBackgrounds[3],
                duration: 60,
                headline: "Advanced Molecular & Life Sciences Research",
                subtext: "Biochemistry, Microbiology, Pharmacy, Zoology & Plant Sciences"
            },
            {
                id: 5,
                title: "Faculty of Social Sciences",
                bg: heroBackgrounds[4],
                duration: 60,
                headline: "Center for Strategic & Policy Studies",
                subtext: "International Relations, Economics, Defence & Strategic Studies"
            },
            {
                id: 6,
                title: "Research & ORIC",
                bg: heroBackgrounds[5],
                duration: 60,
                headline: "Engine of National Scientific Innovation",
                subtext: "PKR 500M+ research funding, incubation center & patents"
            },
            {
                id: 7,
                title: "Admissions & Financial Aid",
                bg: heroBackgrounds[6],
                duration: 60,
                headline: "Open Merit Admissions & Merit Scholarships",
                subtext: "BS, MPhil & PhD degree programs with comprehensive scholarships"
            },
            {
                id: 8,
                title: "Central Library Hub",
                bg: heroBackgrounds[7],
                duration: 60,
                headline: "Dr. Raziuddin Siddiqui Central Library",
                subtext: "250,000+ volumes, HEC Digital Library & PERN network"
            },
            {
                id: 9,
                title: "Campus Life & Hostels",
                bg: heroBackgrounds[8],
                duration: 60,
                headline: "Vibrant Residential Campus Life",
                subtext: "16 Hostels, athletic grounds, transport network & medical services"
            },
            {
                id: 10,
                title: "Societies & Co-Curriculars",
                bg: heroBackgrounds[9],
                duration: 60,
                headline: "Empowering Student Leadership & Talent",
                subtext: "Debating, Computing, Arts, Culture & Green Environmental Clubs"
            },
            {
                id: 11,
                title: "Campus Video Showcase",
                bg: heroBackgrounds[10],
                duration: 170,
                headline: "Quaid-i-Azam University Campus Tour",
                subtext: "Aerial view video showcase of the Margalla campus",
                isVideo: true
            }
        ];

        let currentSlideIndex = 0;
        let isPlaying = true;
        let timeRemaining = slides[0].duration;
        let timerInterval = null;

        window.onload = function() {
            renderDots();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
        };

        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            const stage = document.getElementById('slide-stage');

            stage.style.backgroundImage = `linear-gradient(to right, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.35) 60%, rgba(15, 23, 42, 0.7) 100%), url('${currentSlide.bg}')`;

            if (currentSlide.isVideo) {
                stage.innerHTML = `
                    <div class="hero-enter h-full w-full p-10 flex flex-col justify-between relative z-10">
                        <div class="max-w-3xl mt-auto">
                            <span class="px-3 py-1 rounded-md bg-red-600 text-white text-xs font-bold uppercase tracking-widest mb-3 inline-block">2m 50s Video Tour</span>
                            <h2 class="text-4xl md:text-5xl font-black text-white leading-tight tracking-tight drop-shadow-lg">${currentSlide.headline}</h2>
                            <p class="text-lg text-slate-200 mt-2 drop-shadow">${currentSlide.subtext}</p>
                            <div class="flex items-center space-x-2 mt-4">
                                <span class="w-3 h-3 rounded-full bg-boun-azure inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-white/40 inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-white/40 inline-block"></span>
                                <span class="w-12 h-1 bg-white/80 rounded-full inline-block ml-2"></span>
                            </div>
                        </div>

                        <div class="absolute inset-x-12 bottom-12 top-20 bg-black/80 rounded-2xl border border-white/20 overflow-hidden shadow-2xl z-20 flex items-center justify-center">
                            <video id="qau-campus-video" class="w-full h-full object-cover" autoplay muted playsinline>
                                <source src="qau-1.mp4" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                `;
            } else {
                stage.innerHTML = `
                    <div class="hero-enter h-full w-full p-10 md:p-14 flex justify-between items-center relative z-10">
                        <!-- Left Hero Typography (Boğaziçi Style) -->
                        <div class="max-w-3xl my-auto">
                            <h2 class="text-4xl md:text-6xl font-black text-white leading-[1.1] tracking-tight drop-shadow-md">
                                ${currentSlide.headline}
                            </h2>
                            <p class="text-lg md:text-xl text-slate-200 mt-4 max-w-xl font-medium drop-shadow">
                                ${currentSlide.subtext}
                            </p>
                            
                            <!-- Boğaziçi Left Dash Indicator Bar -->
                            <div class="flex items-center space-x-2 mt-6">
                                <span class="w-3.5 h-3.5 rounded-full bg-white inline-block"></span>
                                <span class="w-3.5 h-3.5 rounded-full bg-white/40 inline-block"></span>
                                <span class="w-3.5 h-3.5 rounded-full bg-white/40 inline-block"></span>
                                <span class="w-16 h-1.5 bg-white rounded-full inline-block ml-2"></span>
                            </div>

                            <div class="mt-8 flex items-center space-x-3 text-xs uppercase tracking-widest text-slate-300 font-bold">
                                <span>Explore QAU Islamabad</span>
                                <div class="w-5 h-8 rounded-full border-2 border-white/60 flex justify-center p-1">
                                    <div class="w-1 h-2 bg-white rounded-full animate-bounce"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column Circular Gallery Jump (Boğaziçi Style) -->
                        <div class="hidden md:flex flex-col space-y-4 my-auto">
                            ${slides.slice(0, 5).map((s, idx) => `
                                <div class="circle-thumb ${idx === (currentSlideIndex % 5) ? 'active' : ''}" onclick="loadSlide(${idx})" title="${s.title}">
                                    <img src="${s.bg}" class="w-full h-full object-cover">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateDots();
            updateProgressBar();

            if (currentSlide.isVideo) {
                setTimeout(() => {
                    const videoElem = document.getElementById('qau-campus-video');
                    if (videoElem) {
                        videoElem.play().catch(e => console.log('Autoplay prevented:', e));
                        videoElem.onended = () => nextSlide();
                    }
                }, 200);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSlide = slides[currentSlideIndex];
            
            if (currentSlide.isVideo) {
                const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                const secs = String(timeRemaining % 60).padStart(2, '0');
                document.getElementById('timer-countdown').innerText = `${mins}:${secs}`;
                document.getElementById('slide-timer-mode').innerText = 'VIDEO SHOWCASE';
            } else {
                document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;
                document.getElementById('slide-timer-mode').innerText = 'AUTO-ADVANCE';
            }
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            if (isPlaying) {
                btnIcon.className = 'fa-solid fa-pause text-xs';
            } else {
                btnIcon.className = 'fa-solid fa-play text-xs';
            }

            const videoElem = document.getElementById('qau-campus-video');
            if (videoElem) {
                isPlaying ? videoElem.play() : videoElem.pause();
            }
        }

        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === currentSlideIndex ? 'bg-boun-azure w-6' : 'bg-white/40 hover:bg-white/70'}`;
                dot.onclick = () => loadSlide(index);
                dot.title = `Slide ${slide.id}: ${slide.title}`;
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, index) => {
                if (index === currentSlideIndex) {
                    dot.className = 'w-6 h-2.5 rounded-full bg-boun-azure transition-all duration-300';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-white/40 hover:bg-white/70 transition-all duration-300';
                }
            });
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');
                
                const clockElem = document.getElementById('digital-clock');
                if (clockElem) {
                    clockElem.innerText = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
                }

                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                const dateElem = document.getElementById('digital-date');
                if (dateElem) {
                    dateElem.innerText = now.toLocaleDateString('en-US', options);
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
