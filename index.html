    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121a1b;
            color: #f4f6f6;
            overflow: hidden;
            user-select: none;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(36, 50, 52, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(223, 171, 54, 0.18);
            box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(26, 37, 39, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(223, 171, 54, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .purple-tint-glow {
            background: radial-gradient(circle at 80% 20%, rgba(59, 47, 76, 0.45) 0%, rgba(36, 50, 52, 0.95) 70%);
        }

        /* Custom Scrollbar for inner readable cards */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(18, 26, 27, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(223, 171, 54, 0.4);
            border-radius: 4px;
        }

        /* Animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* Slide Transition Animations */
        .slide-enter {
            animation: fadeInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* Progress Bar Animation Sync */
        .progress-bar-fill {
            transition: width 0.1s linear;
        }

        /* Video Visualizer equalizer bar animation */
        @keyframes eqBar {
            0%, 100% { height: 15%; }
            50% { height: 95%; }
        }
        .eq-bar-1 { animation: eqBar 0.8s ease-in-out infinite 0.1s; }
        .eq-bar-2 { animation: eqBar 1.1s ease-in-out infinite 0.3s; }
        .eq-bar-3 { animation: eqBar 0.7s ease-in-out infinite 0.2s; }
        .eq-bar-4 { animation: eqBar 0.9s ease-in-out infinite 0.4s; }
        .eq-bar-5 { animation: eqBar 1.2s ease-in-out infinite 0.15s; }
    </style>
</head>

        // APP STATE VARIABLES
        let currentSlideIndex = 0;
        let slideTimer = null;
        let isPlaying = true;
        let timeRemaining = slides[0].duration;
        let timerInterval = null;

        // INITIALIZATION ON DOM LOAD
        window.onload = function() {
            renderDots();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
        };

        // LOAD SLIDE BY INDEX
        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            
            // Render HTML content into slide stage
            const stage = document.getElementById('slide-stage');
            stage.innerHTML = currentSlide.html;

            // Update Header & Footer Labels
            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            // Reset time duration based on slide specific duration (20s for Slide 11, 60s for others)
            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateDots();
            updateProgressBar();
        }

        // TIMER LOGIC & AUTOMATIC ADVANCE
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSlide = slides[currentSlideIndex];
            document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;

            // If slide 11, also update its dedicated internal video badge timer
            const specialTimer = document.getElementById('video-special-timer');
            if (specialTimer) {
                specialTimer.innerText = `${timeRemaining}s`;
            }

            document.getElementById('slide-timer-mode').innerText = currentSlide.id === 11 ? 'VIDEO 20S TIMER' : 'AUTO-ADVANCE';
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        // SLIDE NAVIGATION CONTROLS
        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            if (isPlaying) {
                btnIcon.className = 'fa-solid fa-pause';
            } else {
                btnIcon.className = 'fa-solid fa-play';
            }
        }

        // RENDER NAVIGATION DOTS
        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === currentSlideIndex ? 'bg-brand-gold w-6' : 'bg-slate-600 hover:bg-slate-400'}`;
                dot.onclick = () => loadSlide(index);
                dot.title = `Slide ${slide.id}: ${slide.title}`;
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, index) => {
                if (index === currentSlideIndex) {
                    dot.className = 'w-6 h-2.5 rounded-full bg-brand-gold transition-all duration-300';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-600 hover:bg-slate-400 transition-all duration-300';
                }
            });
        }

        // REAL-TIME DIGITAL CLOCK
        function startClock() {
            function updateClock() {
                const now = new Date();
                
                // Clock format: HH:MM:SS AM/PM
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // hour '0' should be '12'
                const hoursStr = String(hours).padStart(2, '0');
                
                document.getElementById('digital-clock').innerText = `${hoursStr}:${minutes}:${seconds} ${ampm}`;

                // Date format: Day, DD MMM YYYY
                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                document.getElementById('digital-date').innerText = now.toLocaleDateString('en-US', options);
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // FULL SCREEN TOGGLE
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
