                            dark: '#e2e8f0',       // Slate 200 borders/accents
                            deeper: '#0f172a',     // Slate 900 primary text
                            accent: '#1e293b',     // Slate 800 dark accent

                            goldhover: '#b45309',

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow: hidden;
            user-select: none;
        }

        /* Clean Light Glass Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(217, 119, 6, 0.25);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(217, 119, 6, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -3px rgba(15, 23, 42, 0.1);
        }

        .gold-tint-glow {
            background: radial-gradient(circle at 80% 20%, rgba(254, 243, 199, 0.6) 0%, rgba(248, 250, 252, 0.95) 70%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }

        /* Slide Transition Animations */
        .slide-enter {
            animation: fadeInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* Progress Bar Animation Sync */
        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>

        let currentSlideIndex = 0;
        let isPlaying = true;
        let timeRemaining = slides[0].duration;
        let timerInterval = null;

        window.onload = function() {
            renderDots();
            loadSlide(currentSlideIndex);
            startClock();
            startTimer();
        };

        function loadSlide(index) {
            currentSlideIndex = index;
            const currentSlide = slides[currentSlideIndex];
            
            const stage = document.getElementById('slide-stage');
            stage.innerHTML = currentSlide.html;

            document.getElementById('current-slide-num').innerText = String(currentSlide.id).padStart(2, '0');
            document.getElementById('total-slides-num').innerText = String(slides.length).padStart(2, '0');
            document.getElementById('current-slide-title').innerText = currentSlide.title;

            timeRemaining = currentSlide.duration;
            updateTimerDisplay();
            updateDots();
            updateProgressBar();

            if (currentSlide.id === 11) {
                setTimeout(() => {
                    const videoElem = document.getElementById('qau-campus-video');
                    if (videoElem) {
                        videoElem.play().catch(e => console.log('Autoplay prevented:', e));
                        videoElem.onended = () => nextSlide();
                    }
                }, 200);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;

                timeRemaining--;
                updateTimerDisplay();
                updateProgressBar();

                if (timeRemaining <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSlide = slides[currentSlideIndex];
            
            if (currentSlide.id === 11) {
                const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                const secs = String(timeRemaining % 60).padStart(2, '0');
                document.getElementById('timer-countdown').innerText = `${mins}:${secs}`;
                
                const specialTimer = document.getElementById('video-special-timer');
                if (specialTimer) {
                    specialTimer.innerText = `${mins}:${secs}`;
                }
                document.getElementById('slide-timer-mode').innerText = 'VIDEO SHOWCASE';
            } else {
                document.getElementById('timer-countdown').innerText = `${timeRemaining}s`;
                document.getElementById('slide-timer-mode').innerText = 'AUTO-ADVANCE';
            }
        }

        function updateProgressBar() {
            const currentSlide = slides[currentSlideIndex];
            const percentage = ((currentSlide.duration - timeRemaining) / currentSlide.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function nextSlide() {
            let nextIndex = (currentSlideIndex + 1) % slides.length;
            loadSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            loadSlide(prevIndex);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btnIcon = document.getElementById('play-pause-icon');
            if (isPlaying) {
                btnIcon.className = 'fa-solid fa-pause';
            } else {
                btnIcon.className = 'fa-solid fa-play';
            }

            const videoElem = document.getElementById('qau-campus-video');
            if (videoElem) {
                isPlaying ? videoElem.play() : videoElem.pause();
            }
        }

        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === currentSlideIndex ? 'bg-brand-gold w-6' : 'bg-slate-300 hover:bg-slate-400'}`;
                dot.onclick = () => loadSlide(index);
                dot.title = `Slide ${slide.id}: ${slide.title}`;
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, index) => {
                if (index === currentSlideIndex) {
                    dot.className = 'w-6 h-2.5 rounded-full bg-brand-gold transition-all duration-300';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-300 hover:bg-slate-400 transition-all duration-300';
                }
            });
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');
                
                document.getElementById('digital-clock').innerText = `${hoursStr}:${minutes}:${seconds} ${ampm}`;

                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                document.getElementById('digital-date').innerText = now.toLocaleDateString('en-US', options);
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
